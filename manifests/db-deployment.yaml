---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: db-statefulset
  labels:
    app: db
spec:
  replicas: 2
  selector:
    matchLabels:
      app: db
  template:
    metadata:
      labels:
        app: db
    spec:
      containers:
        - name: db-container
          image: devops1117/pythonlib:db_v14
          ports:
            - containerPort: 3306
---
apiVersion: v1
kind: Service
metadata:
  name: db-service
spec:
  ClusterIP: None
  selector:
    app: db
  ports:
    - port: 3306
      targetPort: 3306
  template:
    spec:
      containers:
        - image: devops1117/pythonlib:db_v14
